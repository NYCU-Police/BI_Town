# Staging CD. Runs only after CI succeeds for a push to main.
# pull_request CI must not deploy. A failed CI must never deploy.
# Secrets live in the GitHub environment "staging". Never echo them.

name: Deploy staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Queue. Cancelling this job does not stop the SSH session already
# running git reset / docker compose on the single staging host.
concurrency:
  group: bi-town-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: deploy-staging
    # branches: [main] matches the triggering workflow's head branch.
    # event == push rejects pull_request runs even if that filter is wrong.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      HEALTH_URL: https://bitown.aicanhelp.app/api/health
      BUILD_INFO_URL: https://bitown.aicanhelp.app/build_info.json
      # SHA of the CI run that triggered this deploy. github.sha in a
      # workflow_run job is the default branch tip, not that CI commit.
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      # Artifact was uploaded by CI job godot-export-check as godot-web-build.
      - name: Download Godot web artifact from the CI run
        uses: actions/download-artifact@v4
        with:
          name: godot-web-build
          path: godot-web-build
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Connect Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      # Key is written via printenv so it never appears on the command line.
      - name: Configure SSH
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 177
          printenv STAGING_SSH_KEY > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$STAGING_HOST" >> ~/.ssh/known_hosts

      # --delete keeps /srv/bi_town/game/build/web in sync with this CI export.
      # deploy/.env is outside this path and is never touched.
      - name: Rsync Godot web build to staging
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i ${HOME}/.ssh/staging_key -o IdentitiesOnly=yes -o BatchMode=yes"
          $SSH "${STAGING_USER}@${STAGING_HOST}" "mkdir -p /srv/bi_town/game/build/web"
          rsync -az --delete \
            -e "$SSH" \
            ./godot-web-build/ \
            "${STAGING_USER}@${STAGING_HOST}:/srv/bi_town/game/build/web/"

      # reset --hard is idempotent. .env is not in git, so it survives.
      # GIT_COMMIT is an image build arg. DEPLOYED_AT is container env at create time.
      - name: Deploy on staging host
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "EXPECTED_SHA is not the triggering CI commit"
            exit 1
          fi
          ssh -i "${HOME}/.ssh/staging_key" -o IdentitiesOnly=yes -o BatchMode=yes \
            "${STAGING_USER}@${STAGING_HOST}" \
            bash -c "set -euo pipefail
            cd /srv/bi_town
            git fetch origin main
            # Objects come from origin/main. The tree we build is EXPECTED_SHA.
            git reset --hard ${EXPECTED_SHA}
            export GIT_COMMIT=${EXPECTED_SHA}
            export DEPLOYED_AT=\$(date -u +%Y-%m-%dT%H:%M:%SZ)
            cd deploy
            docker compose --profile tunnel up -d --build"

      # Local check hits 127.0.0.1. Public /api/health and /build_info.json
      # curl the hostname from this same host, so both still cross Cloudflare
      # and the tunnel. GitHub runner IPs are blocked with 403.
      # Each retries every 3s for up to 60s. A mismatch fails the job.
      - name: Health check
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i ${HOME}/.ssh/staging_key -o IdentitiesOnly=yes -o BatchMode=yes"
          expected="${EXPECTED_SHA}"
          if ! printf '%s' "$expected" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "EXPECTED_SHA is not the triggering CI commit"
            exit 1
          fi

          # Curl the public hostname on the deploy host. Do not call it
          # from the runner, and do not fall back to 127.0.0.1.
          curl_public() {
            case "$1" in
              https://bitown.aicanhelp.app/*) ;;
              *)
                echo "refusing public url: $1" >&2
                return 1
                ;;
            esac
            $SSH "${STAGING_USER}@${STAGING_HOST}" \
              "curl -fsS --max-time 20 --retry 0 $(printf '%q' "$1")"
          }

          accept_body() {
            printf '%s' "$1" | python3 -c 'import json,sys; e=sys.argv[1]; b=json.load(sys.stdin); errs=[]; errs.append("status") if b.get("status")!="ok" else None; errs.append("commit got %s want %s"%(b.get("git_commit"),e)) if b.get("git_commit")!=e else None; errs.append("deployed_at") if (b.get("deployed_at") or "") in ("","unknown") else None; print("; ".join(errs)); sys.exit(1 if errs else 0)' "$expected"
          }

          body_after_headers() {
            printf '%s' "$1" | python3 -c 'import sys; raw=sys.stdin.read(); _, sep, body=raw.partition("\r\n\r\n"); sys.stdout.write(body if sep else raw.partition("\n\n")[2])'
          }

          sleep_before_retry() {
            local elapsed=$((SECONDS - start))
            local remaining=$((60 - elapsed))
            if [ "$remaining" -le 0 ]; then
              return 1
            fi
            local pause=3
            if [ "$remaining" -lt 3 ]; then
              pause=$remaining
            fi
            echo "$1 attempt $2 failed (${3}); retrying in ${pause}s"
            sleep "$pause"
          }

          start=$SECONDS
          attempt=0
          local_ok=0
          while [ $((SECONDS - start)) -lt 60 ]; do
            attempt=$((attempt + 1))
            reason="request failed"
            if raw=$($SSH "${STAGING_USER}@${STAGING_HOST}" \
              "curl -fsS -D - http://127.0.0.1:8100/api/health"); then
              if ! printf '%s' "$raw" | grep -qi 'cache-control:.*no-store'; then
                reason="missing Cache-Control: no-store"
              elif reason=$(accept_body "$(body_after_headers "$raw")"); then
                echo "local health check passed on attempt ${attempt}"
                body_after_headers "$raw"
                local_ok=1
                break
              fi
            fi
            if ! sleep_before_retry "local health check" "$attempt" "$reason"; then
              break
            fi
          done
          if [ "$local_ok" -ne 1 ]; then
            echo "local health check failed after ${attempt} attempts"
            exit 1
          fi

          start=$SECONDS
          attempt=0
          public_ok=0
          while [ $((SECONDS - start)) -lt 60 ]; do
            attempt=$((attempt + 1))
            reason="request failed"
            if body=$(curl_public "${HEALTH_URL}"); then
              if reason=$(accept_body "$body"); then
                echo "public health check passed on attempt ${attempt}"
                echo "$body"
                public_ok=1
                break
              fi
            fi
            if ! sleep_before_retry "public health check" "$attempt" "$reason"; then
              break
            fi
          done
          if [ "$public_ok" -ne 1 ]; then
            echo "public health check failed after ${attempt} attempts"
            exit 1
          fi

          accept_build_info() {
            printf '%s' "$1" | python3 -c 'import json,sys; e=sys.argv[1]; b=json.load(sys.stdin); got=b.get("commit") if isinstance(b, dict) else None; errs=[] if got==e else ["build_info commit got %s want %s"%(got, e)]; print("; ".join(errs)); sys.exit(1 if errs else 0)' "$expected"
          }

          start=$SECONDS
          attempt=0
          build_info_ok=0
          while [ $((SECONDS - start)) -lt 60 ]; do
            attempt=$((attempt + 1))
            reason="request failed"
            if body=$(curl_public "${BUILD_INFO_URL}"); then
              if reason=$(accept_build_info "$body"); then
                echo "public build_info check passed on attempt ${attempt}"
                echo "$body"
                build_info_ok=1
                break
              fi
            fi
            if ! sleep_before_retry "public build_info check" "$attempt" "$reason"; then
              break
            fi
          done
          if [ "$build_info_ok" -ne 1 ]; then
            echo "public build_info check failed after ${attempt} attempts"
            exit 1
          fi
