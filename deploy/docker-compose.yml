# One compose file for local and staging.
# Local:    docker compose up --build
# Staging:  docker compose --profile tunnel up -d --build
#
# Godot web files are bind-mounted (not COPY'd). :z is for SELinux;
# on Ubuntu it is a no-op.

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BI_TOWN_PORT:-8100}:8000"
    environment:
      STATIC_WEB_DIR: /app/web
      ENVIRONMENT: ${ENVIRONMENT:-staging}
    volumes:
      - ../game/build/web:/app/web:ro,z
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bi_town}
      POSTGRES_USER: ${POSTGRES_USER:-bi_town}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # Only started with --profile tunnel (staging). Local `up` skips it.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
