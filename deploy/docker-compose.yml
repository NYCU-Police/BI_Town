# One compose file for local and staging.
# Local:    docker compose up --build
# Staging:  docker compose --profile tunnel up -d --build
#
# Godot web files are bind-mounted (not COPY'd). :z is for SELinux;
# on Ubuntu it is a no-op.

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:${BI_TOWN_PORT:-8100}:8000"
    environment:
      STATIC_WEB_DIR: /app/web
      ENVIRONMENT: ${ENVIRONMENT:-staging}
      # Set when the container is created, not baked into the image.
      DEPLOYED_AT: ${DEPLOYED_AT:-unknown}
      # rules is the public default. llm calls Ollama on the deploy host.
      BRAIN_MODE: ${BRAIN_MODE:-rules}
      GAME_MINUTES_PER_REAL_SECOND: ${GAME_MINUTES_PER_REAL_SECOND:-0.4}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:14b}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_THINK: ${LLM_THINK:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../game/build/web:/app/web:ro,z
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bi_town}
      POSTGRES_USER: ${POSTGRES_USER:-bi_town}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # Only started with --profile tunnel (staging). Local `up` skips it.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
